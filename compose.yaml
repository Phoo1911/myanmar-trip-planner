services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U travel -d travel"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://travel:${POSTGRES_PASSWORD}@db:5432/travel
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      RECEIPT_SECRET: ${RECEIPT_SECRET:?set RECEIPT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_INTERNAL_ORIGIN: http://api:8000
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
volumes:
  postgres_data:
