limit_req_zone $binary_remote_addr zone=public_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=costly:10m rate=5r/m;
server {
    listen 8080;
    server_tokens off;
    # Only the internal Caddy container can reach this unexposed gateway.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    client_max_body_size 16k;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location ~ ^/(bookings|itineraries) {
        limit_req zone=costly burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_read_timeout 40s;
    }
    location / {
        limit_req zone=public_api burst=20 nodelay;
        proxy_pass http://api:8000;
    }
}
