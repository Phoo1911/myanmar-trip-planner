# No paid instances. Free preview: web sleeps when idle; Postgres expires after 30 days.
services:
  - type: web
    name: myanmar-journey-free
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.free
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: myanmar-journey-free-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: RECEIPT_SECRET
        generateValue: true
      - key: INTERNAL_PROXY_TOKEN
        generateValue: true
      - key: REQUIRE_PROXY_TOKEN
        value: 'true'
      - key: CORS_ORIGINS
        value: ''
      - key: API_INTERNAL_ORIGIN
        value: http://127.0.0.1:8000
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: NEXT_PUBLIC_DEMO_MODE
        value: 'true'
      - key: OPENAI_API_KEY
        value: ''
      - key: YOUTUBE_API_KEY
        value: ''
      - key: PORT
        value: '10000'
databases:
  - name: myanmar-journey-free-db
    region: singapore
    plan: free
    databaseName: travel
    user: travel
    ipAllowList: []
