name: verify
on: [push, pull_request]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: travel
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
      - run: cd backend && alembic upgrade head && alembic current
        env:
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/travel
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm typecheck && pnpm build
      - run: docker compose build
        env:
          POSTGRES_PASSWORD: ci-test-password
          ADMIN_TOKEN: ci-admin-token-000000000000000000000000
          RECEIPT_SECRET: ci-receipt-token-000000000000000000000
      - name: Start containers and verify web to API to PostgreSQL
        run: |
          docker compose up -d
          curl --retry 20 --retry-delay 2 --retry-all-errors -fsS http://localhost:8000/health
          curl --retry 20 --retry-delay 2 --retry-all-errors -fsS http://localhost:3000 > /tmp/page.html
          python -c "assert 'Myanmar Journey' in open('/tmp/page.html').read()"
          curl --retry 10 --retry-delay 2 --retry-all-errors -fsS http://localhost:3000/api/health
        env:
          POSTGRES_PASSWORD: ci-test-password
          ADMIN_TOKEN: ci-admin-token-000000000000000000000000
          RECEIPT_SECRET: ci-receipt-token-000000000000000000000
      - name: Stop test containers
        if: always()
        run: docker compose down -v
        env:
          POSTGRES_PASSWORD: ci-test-password
          ADMIN_TOKEN: ci-admin-token-000000000000000000000000
          RECEIPT_SECRET: ci-receipt-token-000000000000000000000
