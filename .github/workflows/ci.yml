name: verify
on: [push, pull_request]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: travel
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
      - run: cd backend && alembic upgrade head && alembic current
        env:
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/travel
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm test && pnpm typecheck && pnpm build
      - run: docker compose build
        env:
          POSTGRES_PASSWORD: ci-test-password
          ADMIN_TOKEN: ci-admin-token-000000000000000000000000
          RECEIPT_SECRET: ci-receipt-token-000000000000000000000
      - name: Start containers and verify web to API to PostgreSQL
        run: |
          docker compose up -d
          curl --retry 20 --retry-delay 2 --retry-all-errors -fsS http://localhost:8000/health
          curl --retry 20 --retry-delay 2 --retry-all-errors -fsS http://localhost:3000 > /tmp/page.html
          python -c "assert 'Myanmar Trip Planner' in open('/tmp/page.html').read()"
          curl --retry 10 --retry-delay 2 --retry-all-errors -fsS http://localhost:3000/api/health
        env:
          POSTGRES_PASSWORD: ci-test-password
          ADMIN_TOKEN: ci-admin-token-000000000000000000000000
          RECEIPT_SECRET: ci-receipt-token-000000000000000000000
      - name: Build and run the free combined image
        run: |
          docker build -f Dockerfile.free -t journey-free .
          network=$(docker inspect $(docker compose ps -q db) --format '{{range $k, $_ := .NetworkSettings.Networks}}{{$k}}{{end}}')
          docker run -d --name journey-free --network "$network" -p 127.0.0.1:3010:10000 -e DATABASE_URL=postgresql+psycopg://travel:ci-test-password@db:5432/travel -e APP_ENV=production -e REQUIRE_PROXY_TOKEN=true -e CORS_ORIGINS= -e ADMIN_TOKEN -e RECEIPT_SECRET -e INTERNAL_PROXY_TOKEN journey-free
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://localhost:3010/api/health
          curl -fsS http://localhost:3010 > /tmp/free-page.html
          python -c "assert 'Free preview' in open('/tmp/free-page.html').read() or '무료 체험' in open('/tmp/free-page.html').read()"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3010/api/admin/bookings)" = 401
        env:
          POSTGRES_PASSWORD: ci-test-password
          ADMIN_TOKEN: ci-admin-token-000000000000000000000000
          RECEIPT_SECRET: ci-receipt-token-000000000000000000000
          INTERNAL_PROXY_TOKEN: ci-proxy-token-0000000000000000000000
      - name: Stop test containers
        if: always()
        run: |
          docker rm -f journey-free || true
          docker compose down -v
        env:
          POSTGRES_PASSWORD: ci-test-password
          ADMIN_TOKEN: ci-admin-token-000000000000000000000000
          RECEIPT_SECRET: ci-receipt-token-000000000000000000000
